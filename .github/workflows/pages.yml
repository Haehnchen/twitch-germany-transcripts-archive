name: Publish archive viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: viewer
          fetch-depth: 1
      - uses: actions/configure-pages@v6.0.0
      - name: Set archive source
        env:
          ARCHIVE_REPOSITORY: ${{ github.repository }}
          ARCHIVE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('viewer/repository.json').write_text(json.dumps({
              'repository': os.environ['ARCHIVE_REPOSITORY'],
              'branch': os.environ['ARCHIVE_BRANCH'],
          }))
          PY
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: viewer
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v5.0.1
